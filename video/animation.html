<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Alsó bölcsességfog műtét – oktatóvideó</title>
<style>
  html,body{margin:0;background:#111;}
  canvas{display:block;width:100vw;height:auto;max-width:1920px;margin:0 auto;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="narration_timing.js"></script>
<script>
"use strict";
/* =====================================================================
   Alsó bölcsességfogak műtéti eltávolítása – animált, feliratozott
   oktatóvideó. Determinisztikus: renderAt(t) egy képkockát rajzol.
   ===================================================================== */
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SX = 40, SY = 128, SW = 1220, SH = 762;      // színpad (ábra)
const PX = 1290, PY = 128, PW = 590, PH = 762;     // kulcspont-panel
const FONT = 'Inter, "DejaVu Sans", Arial, sans-serif';

/* ---------- segédfüggvények ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const P = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// animáció-progresszió egy felirat időablakán belül
function A(s, ci, f0 = 0, f1 = 1) {
  if (ci >= s.n) return s.t >= s.T ? 1 : 0;
  const st = s.cs[ci], d = s.cd[ci];
  return ease(clamp((s.t - (st + d * f0)) / Math.max(0.001, d * (f1 - f0))));
}
function Al(s, ci, f0 = 0, f1 = 1) { // lineáris
  if (ci >= s.n) return 0;
  const st = s.cs[ci], d = s.cd[ci];
  return clamp((s.t - (st + d * f0)) / Math.max(0.001, d * (f1 - f0)));
}
const fin = (s, ci, dur = .5) => ci >= s.n ? 0 : clamp((s.t - s.cs[ci]) / dur);
const vis = (s, a, b) => Math.min(fin(s, a), b == null ? 1 : 1 - fin(s, b));

function poly(g, pts, close = true) { if (!pts || !pts.length) return; g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); if (close) g.closePath(); }
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function partial(pts, p) {
  if (p <= 0 || pts.length < 2) return [];
  if (p >= 1) return pts.slice();
  const L = polyLen(pts) * p; const out = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc + d >= L) { out.push(P(pts[i - 1], pts[i], (L - acc) / d)); return out; }
    acc += d; out.push(pts[i]);
  }
  return out;
}
function catmull(pts, n = 10) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => .5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function strokePts(g, pts, color, lw, dash) {
  if (pts.length < 2) return;
  g.save(); g.beginPath(); poly(g, pts, false);
  g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  if (dash) g.setLineDash(dash);
  g.stroke(); g.restore();
}
function incision(g, pts, p, color = '#d7263d', dash) {
  const q = partial(pts, p);
  if (q.length < 2) return null;
  strokePts(g, q, 'rgba(255,255,255,.75)', 12, dash);
  strokePts(g, q, color, 6, dash);
  const a = q[q.length - 1], b = q[q.length - 2];
  return { x: a[0], y: a[1], ang: Math.atan2(a[1] - b[1], a[0] - b[0]) };
}
function arrow(g, x1, y1, x2, y2, o = {}) {
  const c = o.color || '#1f7a8c', lw = o.lw || 5, hd = o.head || 18;
  g.save(); g.globalAlpha *= (o.a ?? 1);
  const ang = Math.atan2(y2 - y1, x2 - x1);
  g.strokeStyle = c; g.fillStyle = c; g.lineWidth = lw; g.lineCap = 'round';
  if (o.dash) g.setLineDash(o.dash);
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2 - Math.cos(ang) * hd * .6, y2 - Math.sin(ang) * hd * .6); g.stroke();
  g.setLineDash([]);
  g.beginPath(); g.moveTo(x2, y2);
  g.lineTo(x2 - Math.cos(ang - .45) * hd, y2 - Math.sin(ang - .45) * hd);
  g.lineTo(x2 - Math.cos(ang + .45) * hd, y2 - Math.sin(ang + .45) * hd);
  g.closePath(); g.fill(); g.restore();
}
function carrow(g, pts, o = {}) {
  if (pts.length < 2) return;
  g.save(); g.globalAlpha *= (o.a ?? 1);
  strokePts(g, pts.slice(0, -1), o.color || '#1f7a8c', o.lw || 5, o.dash);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  arrow(g, a[0], a[1], b[0], b[1], { ...o, a: 1, dash: null });
  g.restore();
}
function wrap(g, text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (g.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
// címke dobozzal és mutatóvonallal
function tag(g, text, x, y, o = {}) {
  const a = o.a ?? 1; if (a <= 0.001) return;
  g.save(); g.globalAlpha *= a;
  const fs = o.fs || 24;
  g.font = `${o.bold ? 700 : 600} ${fs}px ${FONT}`;
  const lines = o.maxW ? wrap(g, text, o.maxW) : text.split('\n');
  const lw = Math.max(...lines.map(l => g.measureText(l).width));
  const pad = 11, lh = fs * 1.22;
  const bw = lw + pad * 2, bh = lines.length * lh + pad * 1.1;
  let bx = x, by = y - bh / 2;
  if (o.align === 'c') bx = x - bw / 2; else if (o.align === 'r') bx = x - bw;
  if (o.to) {
    const ax = clamp(o.to[0], bx + 8, bx + bw - 8), ay = clamp(o.to[1], by, by + bh);
    g.strokeStyle = o.lc || 'rgba(25,40,48,.85)'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(o.to[0], o.to[1]); g.stroke();
    g.fillStyle = o.lc || 'rgba(25,40,48,.9)';
    g.beginPath(); g.arc(o.to[0], o.to[1], 5, 0, 7); g.fill();
  }
  g.fillStyle = o.bg || 'rgba(255,255,255,.94)';
  g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 8; g.shadowOffsetY = 2;
  g.beginPath(); g.roundRect(bx, by, bw, bh, 9); g.fill();
  g.shadowColor = 'transparent';
  if (o.border) { g.strokeStyle = o.border; g.lineWidth = 3; g.stroke(); }
  g.fillStyle = o.color || '#1b2a31'; g.textBaseline = 'middle'; g.textAlign = 'left';
  lines.forEach((l, i) => g.fillText(l, bx + pad, by + pad * .55 + lh * (i + .5)));
  g.restore();
}
function text(g, str, x, y, o = {}) {
  g.save(); g.globalAlpha *= (o.a ?? 1);
  g.font = `${o.w || 600} ${o.fs || 24}px ${FONT}`;
  g.fillStyle = o.color || '#1b2a31'; g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'middle';
  if (o.maxW) { const lines = wrap(g, str, o.maxW); const lh = (o.fs || 24) * (o.lh || 1.25); lines.forEach((l, i) => g.fillText(l, x, y + i * lh)); g.restore(); return lines.length * lh; }
  g.fillText(str, x, y); g.restore(); return (o.fs || 24) * 1.25;
}
function pulse(g, x, y, t, color = '#ffb400', r0 = 14) {
  g.save();
  for (let k = 0; k < 2; k++) {
    const ph = (t * 1.2 + k * .5) % 1;
    g.globalAlpha = (1 - ph) * .8; g.strokeStyle = color; g.lineWidth = 4;
    g.beginPath(); g.arc(x, y, r0 + ph * 34, 0, 7); g.stroke();
  }
  g.restore();
}
function warnBadge(g, x, y, a = 1, s = 1) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = '#e63946'; g.beginPath(); g.moveTo(0, -26); g.lineTo(26, 20); g.lineTo(-26, 20); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.font = `800 30px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('!', 0, 5);
  g.restore();
}
function checkBadge(g, x, y, a = 1, ok = true, s = 1) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = ok ? '#2a9d55' : '#e63946'; g.beginPath(); g.arc(0, 0, 24, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath();
  if (ok) { g.moveTo(-11, 1); g.lineTo(-3, 10); g.lineTo(12, -9); } else { g.moveTo(-9, -9); g.lineTo(9, 9); g.moveTo(9, -9); g.lineTo(-9, 9); }
  g.stroke(); g.restore();
}
function star(g, x, y, r, a = 1, color = '#ffb400') {
  g.save(); g.globalAlpha *= a; g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 16; i++) { const ang = i * Math.PI / 8, rr = i % 2 ? r * .42 : r; g.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  g.closePath(); g.fill(); g.restore();
}

/* ---------- mintázatok, színek ---------- */
function makePattern(g, base, dots, seed) {
  const c = document.createElement('canvas'); c.width = c.height = 96; const p = c.getContext('2d');
  p.fillStyle = base; p.fillRect(0, 0, 96, 96);
  const r = rng(seed);
  for (let i = 0; i < 30; i++) {
    const x = r() * 96, y = r() * 96, rad = 2 + r() * 5.5;
    p.beginPath(); p.ellipse(x, y, rad, rad * (.55 + r() * .5), r() * 3, 0, 7);
    p.fillStyle = dots; p.fill();
    p.beginPath(); p.ellipse(x - 96, y, rad, rad * .7, 0, 0, 7); p.ellipse(x, y - 96, rad, rad * .7, 0, 0, 7); p.fill();
  }
  return g.createPattern(c, 'repeat');
}
const COL = {
  enamel: '#fdfcf7', enamelEdge: '#857c6c', root: '#f2e1bd', rootEdge: '#9a835c',
  bone: '#ecd9b6', boneEdge: '#c49e66', cavity: '#7c3b3f', ging: '#efa9ad', gingEdge: '#c26a74',
  inc: '#d7263d', nerve: '#f4c430', teal: '#1f7a8c', ink: '#1b2a31', hl: '#ffe066'
};
function offscreen() { const c = document.createElement('canvas'); c.width = SW; c.height = SH; return c; }
const MK = offscreen(), MG = MK.getContext('2d');   // eltávolított terület maszk
const TK = offscreen(), TG = TK.getContext('2d');   // színezett üreg
const CK = offscreen(), CG = CK.getContext('2d');   // fedő csont
let BONE, BONE_C, BONE_T;
function initPatterns() {
  BONE = makePattern(ctx, COL.bone, 'rgba(190,150,95,.33)', 7);
  BONE_C = makePattern(CG, COL.bone, 'rgba(190,150,95,.33)', 7);
}

/* ---------- oldalnézeti fog ---------- */
function crownPath(w, ch) {
  const h = w / 2, p = new Path2D();
  p.moveTo(-h + 10, 0);
  p.bezierCurveTo(-h - 4, -ch * .25, -h - 3, -ch * .7, -h + 8, -ch * .88);
  p.bezierCurveTo(-h + 18, -ch * 1.03, -h * .36, -ch * 1.06, -h * .12, -ch * .93);
  p.quadraticCurveTo(0, -ch * .85, h * .12, -ch * .93);
  p.bezierCurveTo(h * .36, -ch * 1.05, h - 18, -ch * 1.01, h - 8, -ch * .88);
  p.bezierCurveTo(h + 3, -ch * .7, h + 4, -ch * .25, h - 10, 0);
  p.quadraticCurveTo(0, 9, -h + 10, 0);
  p.closePath(); return p;
}
function rootPath(w, rl, type) {
  const h = w / 2, p = new Path2D();
  p.moveTo(-h + 10, 0);
  if (type === 'conical') {
    p.bezierCurveTo(-h + 8, rl * .4, -26, rl * .86, -10, rl);
    p.quadraticCurveTo(0, rl + 10, 10, rl);
    p.bezierCurveTo(26, rl * .86, h - 8, rl * .4, h - 10, 0);
  } else if (type === 'curvedD') {
    p.bezierCurveTo(-h + 4, rl * .45, -h + 18, rl * .86, -h + 52, rl);
    p.quadraticCurveTo(-h + 72, rl + 6, -h + 74, rl * .9);
    p.bezierCurveTo(-h + 54, rl * .7, -14, rl * .42, 2, rl * .3);
    p.bezierCurveTo(16, rl * .45, h - 30, rl * .72, h + 10, rl * .86);
    p.quadraticCurveTo(h + 26, rl * .84, h + 18, rl * .72);
    p.bezierCurveTo(h + 2, rl * .55, h + 2, rl * .25, h - 10, 0);
  } else { // 'two' / 'separate'
    const sp = type === 'separate' ? 16 : 0;
    p.bezierCurveTo(-h + 6 - sp, rl * .35, -h + 18 - sp, rl * .8, -h + 32 - sp, rl);
    p.quadraticCurveTo(-h + 46 - sp, rl + 12, -h + 58 - sp, rl * .95);
    p.bezierCurveTo(-h + 60 - sp, rl * .6, -14, rl * .38, 0, rl * .3);
    p.bezierCurveTo(14, rl * .38, h - 60 + sp, rl * .6, h - 58 + sp, rl * .95);
    p.quadraticCurveTo(h - 46 + sp, rl + 12, h - 32 + sp, rl);
    p.bezierCurveTo(h - 18 + sp, rl * .8, h - 6 + sp, rl * .35, h - 10, 0);
  }
  p.quadraticCurveTo(0, 9, -h + 10, 0);
  p.closePath(); return p;
}
function tSpec(o) { return Object.assign({ w: 152, ch: 112, rl: 185, roots: 'two', dx: 0, dy: 0, rot: 0, pv: [0, 0], alpha: 1 }, o); }
function toothXf(g, sp, pc) {
  g.translate(sp.x + sp.dx, sp.y + sp.dy);
  if (sp.rot) { g.translate(sp.pv[0], sp.pv[1]); g.rotate(sp.rot); g.translate(-sp.pv[0], -sp.pv[1]); }
  if (pc) {
    g.translate(pc.dx || 0, pc.dy || 0);
    if (pc.rot) { const pv = pc.pv || [0, 0]; g.translate(pv[0], pv[1]); g.rotate(pc.rot); g.translate(-pv[0], -pv[1]); }
  }
}
function drawTooth(g, sp) {
  const crown = crownPath(sp.w, sp.ch), root = rootPath(sp.w, sp.rl, sp.roots);
  const one = pc => {
    if (pc && (pc.alpha ?? 1) <= 0.001) return;
    g.save(); g.globalAlpha *= sp.alpha * (pc ? (pc.alpha ?? 1) : 1);
    toothXf(g, sp, pc);
    if (pc && pc.clip) { g.beginPath(); poly(g, pc.clip); g.clip(); }
    const rg = g.createLinearGradient(-sp.w / 2, 0, sp.w / 2, 0);
    rg.addColorStop(0, '#e8d3a6'); rg.addColorStop(.45, '#f6e9cc'); rg.addColorStop(1, '#e2c995');
    g.fillStyle = rg; g.fill(root); g.strokeStyle = COL.rootEdge; g.lineWidth = 3; g.stroke(root);
    const cg = g.createLinearGradient(-sp.w / 2, -sp.ch, sp.w / 2, 0);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(.6, '#f7f3e8'); cg.addColorStop(1, '#e9e1cd');
    g.fillStyle = cg; g.fill(crown); g.strokeStyle = COL.enamelEdge; g.lineWidth = 3; g.stroke(crown);
    g.strokeStyle = 'rgba(160,145,120,.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-sp.w * .12, -sp.ch * .9); g.quadraticCurveTo(0, -sp.ch * .7, sp.w * .12, -sp.ch * .9); g.stroke();

}
function toothShape(g, sp, withRoots = true) { // maszkhoz
  g.save(); toothXf(g, sp, null);
  g.fill(crownPath(sp.w, sp.ch)); if (withRoots) g.fill(rootPath(sp.w, sp.rl, sp.roots));

/* oldalnézeti jelenet */
function side(s, o) {
  const g = ctx;
  g.fillStyle = '#fbf6f1'; g.fillRect(0, 0, SW, SH);
  // háttér: szájüreg árnyalat felül
  const bg = g.createLinearGradient(0, 0, 0, 380); bg.addColorStop(0, '#f6e6e3'); bg.addColorStop(1, '#fbf6f1');
  g.fillStyle = bg; g.fillRect(0, 0, SW, 380);
  const bonePoly = [...o.top, [SW, SH], [0, SH]];
  // csont
  g.save(); g.beginPath(); poly(g, bonePoly); g.fillStyle = BONE; g.fill();
  const sh = g.createLinearGradient(0, 300, 0, SH); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(150,110,60,.18)');
  g.fillStyle = sh; g.fill(); g.restore();
  strokePts(g, o.top, COL.boneEdge, 5);
  // canalis mandibulae
  if (o.canal !== false) {
    const cpts = catmull([[0, 690], [400, 680], [800, 640], [1220, 560]], 12);
    strokePts(g, cpts, 'rgba(160,120,70,.35)', 34);
    strokePts(g, cpts, 'rgba(244,196,48,.55)', 9);
  }
  // eltávolított terület (üreg)
  MG.clearRect(0, 0, SW, SH);
  if (o.mask) { MG.save(); MG.fillStyle = '#000'; MG.strokeStyle = '#000'; MG.lineCap = 'round'; MG.lineJoin = 'round'; o.mask(MG); MG.restore(); }
  if (o.mask) {
    TG.clearRect(0, 0, SW, SH); TG.globalCompositeOperation = 'source-over'; TG.drawImage(MK, 0, 0);
    TG.globalCompositeOperation = 'source-in';
    const cg = TG.createLinearGradient(0, 200, 0, 700); cg.addColorStop(0, '#9b4c4f'); cg.addColorStop(1, '#5e2a2e');
    TG.fillStyle = cg; TG.fillRect(0, 0, SW, SH); TG.globalCompositeOperation = 'source-over';
    g.save(); g.beginPath(); poly(g, bonePoly); g.clip(); g.drawImage(TK, 0, 0); g.restore();
  }
  if (o.under) o.under(g);
  // íny
  const gx = o.ging ?? 470;
  const gp = o.top.filter(p => p[0] <= gx + 1);
  if (gp.length > 1) {
    const up = gp.map(p => [p[0], p[1] - 24]).reverse();
    g.save(); g.beginPath(); poly(g, [...gp, ...up]); g.fillStyle = COL.ging; g.fill();
    g.strokeStyle = COL.gingEdge; g.lineWidth = 2.5; g.stroke(); g.restore();
  }
  // fogak
  (o.teeth || []).forEach(t => drawTooth(g, t));
  // fedő csont
  if (o.cover) {
    CG.clearRect(0, 0, SW, SH); CG.globalCompositeOperation = 'source-over';
    CG.save(); CG.beginPath(); poly(CG, o.cover); CG.clip();
    CG.beginPath(); poly(CG, bonePoly); CG.fillStyle = BONE_C; CG.fill();
    if (o.coverDash) { CG.save(); CG.globalAlpha = .55; CG.setLineDash([9, 8]); CG.strokeStyle = '#6b6152'; CG.lineWidth = 3; toothXf(CG, o.coverDash, null); CG.stroke(crownPath(o.coverDash.w, o.coverDash.ch)); CG.restore(); }
    CG.restore();
    if (o.mask) { CG.globalCompositeOperation = 'destination-out'; CG.drawImage(MK, 0, 0); CG.globalCompositeOperation = 'source-over'; }
    g.drawImage(CK, 0, 0);
  }
  if (o.over) o.over(g);
}

/* ---------- műszerek ---------- */
function steel(g, x0, y0, x1, y1) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, '#7f8b93'); gr.addColorStop(.35, '#f1f4f6'); gr.addColorStop(.6, '#c4cdd3'); gr.addColorStop(1, '#6f7c85');
  return gr;
}
// könyökdarab: fúróhegy (x,y), a fúró lefelé mutat; ang forgatás
function contraAngle(g, x, y, ang = 0, bur = 'round', s = 1, burLen = 74) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.fillStyle = steel(g, -4, 0, 4, 0); g.fillRect(-3.5, -burLen, 7, burLen - 10);
  if (bur === 'round') {
    const rg = g.createRadialGradient(-3, -11, 2, 0, -8, 11); rg.addColorStop(0, '#fff'); rg.addColorStop(1, '#5d676d');
    g.fillStyle = rg; g.beginPath(); g.arc(0, -8, 10, 0, 7); g.fill();

// felirat időtartama: olvasási idő, illetve ha van felolvasás, annak hossza + szünet
const capDur = (t, si, ci) => {
  const nd = window.NARR_DUR && window.NARR_DUR[si] ? window.NARR_DUR[si][ci] : 0;
  return Math.max(3.6, t.length / 14 + 1.4, nd ? nd + 0.75 : 0);
};
let TOTAL = 0;
SCENES.forEach((sc, si) => {
  sc.cd = sc.caps.map((c, ci) => capDur(c, si, ci)); sc.cs = []; let t = .6;
  for (const d of sc.cd) { sc.cs.push(t); t += d; }
  sc.T = t + (sc.tail || .8); sc.start = TOTAL; TOTAL += sc.T;
});
window.TOTAL = TOTAL;
window.CAPTEXTS = () => SCENES.map(sc => sc.caps);
window.CAPTIONS = () => {
  const out = [];
  SCENES.forEach((sc, si) => sc.caps.forEach((c, i) => {
    const st = sc.start + sc.cs[i];
    const en = i + 1 < sc.caps.length ? sc.start + sc.cs[i + 1] : sc.start + sc.T;
    out.push({ start: st, end: en - .05, text: c, si, ci: i });
  }));
  return out;
};
window.CHAPTERS = () => SCENES.map(sc => ({ start: sc.start, title: (sc.chap ? sc.chap + ' ' : '') + (sc.title || 'Cím') }));

function drawFrameChrome(sc, s) {

  text(g, 'Alsó bölcsességfogak műtéti eltávolítása', W - 40, 53, { fs: 22, w: 500, color: '#9cc9cf', align: 'right' });

function drawSubtitle(sc, s) {

function renderAt(gt) {
  gt = clamp(gt, 0, TOTAL - 1e-3);
  let sc = SCENES[0];
  for (const c of SCENES) if (gt >= c.start) sc = c;
  const t = gt - sc.start;
  let ci = -1; sc.cs.forEach((st, i) => { if (t >= st) ci = i; });
  const s = { t, T: sc.T, cs: sc.cs, cd: sc.cd, n: sc.caps.length, ci };
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (sc.full) {
    sc.draw(s);
  } else {
    drawFrameChrome(sc, s);
    ctx.save(); ctx.translate(SX, SY);
    ctx.beginPath(); ctx.roundRect(0, 0, SW, SH, 18); ctx.clip();
    sc.draw(s);
    ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(SX, SY, SW, SH, 18); ctx.stroke(); ctx.restore();
    drawPanel(sc, s);

  if (fade > 0) { ctx.fillStyle = `rgba(233,228,221,${fade})`; ctx.fillRect(0, 0, W, 906); }
  drawSubtitle(sc, s);
  ctx.restore();
}

  }

})();
